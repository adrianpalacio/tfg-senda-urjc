<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senda URJC — v1 funcional</title>
<link rel="icon" href="assets/urjc-simbolo.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/senda.css?v=6">
</head>
<body>

<!-- Pantalla de acceso (RF-01: autenticación corporativa; LDAP/SSO simulado y declarado) -->
<div id="pantalla-login" class="pantalla-login">
  <div class="login-caja">
    <img src="assets/urjc-simbolo.png" alt="Universidad Rey Juan Carlos" class="login-logo">
    <h1>Senda URJC</h1>
    <p class="login-sub">Rutas seguras por los campus</p>
    <form id="form-login" autocomplete="off">
      <label for="login-email">Correo corporativo</label>
      <input type="email" id="login-email" placeholder="nombre.apellido@urjc.es" required>
      <label for="login-pass">Contraseña <span style="font-weight:normal;color:#888">(cualquiera, es una demo)</span></label>
      <input type="password" id="login-pass" placeholder="Escribe cualquier contraseña">
      <button type="submit" class="btn btn-primario">Entrar con cuenta URJC</button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </form>
    <p class="login-nota">Demo académica (TFG). La autenticación contra el directorio corporativo
    (LDAP/SSO) está <strong>simulada</strong>: se valida el dominio <code>@urjc.es</code> /
    <code>@alumnos.urjc.es</code>, sin contraseña real.</p>
  </div>
</div>

<!-- Aplicación -->
<div id="app" hidden>
  <header class="cabecera">
    <div class="cabecera-marca">
      <img src="assets/urjc-simbolo-neg.png" alt="URJC" class="cabecera-logo">
      <span class="cabecera-titulo">Senda URJC</span>
    </div>
    <nav class="cabecera-nav" aria-label="Secciones">
      <button class="nav-btn activo" data-vista="rutas">Rutas</button>
      <button class="nav-btn" data-vista="voycontigo">Voy contigo</button>
      <button class="nav-btn" data-vista="incidencias">Incidencias</button>
      <button class="nav-btn" data-vista="perfil">Perfil</button>
    </nav>
    <div class="cabecera-acciones">
      <a class="enlace-admin" href="admin.html" target="_blank" title="Panel de administración (PDI/PTGAS)">Administración</a>
      <button id="btn-sos" class="btn-sos" title="Botón de emergencia (RF-14)">SOS</button>
    </div>
  </header>

  <div class="cuerpo">
    <aside class="panel-lateral" id="panel-lateral">
      <!-- Las vistas se montan desde app.js -->
      <section id="vista-rutas" class="vista activo"></section>
      <section id="vista-voycontigo" class="vista"></section>
      <section id="vista-incidencias" class="vista"></section>
      <section id="vista-perfil" class="vista"></section>
    </aside>
    <main class="zona-mapa">
      <div id="mapa" role="application" aria-label="Mapa del campus"></div>
      <div class="barra-estado" id="barra-estado">
        <span id="estado-hora"></span>
        <span id="estado-luz"></span>
        <span id="estado-lumen"></span>
      </div>
      <div class="control-hora" title="Hora simulada del día (para la demo)">
        <label for="hora-sim">Hora simulada</label>
        <input type="range" id="hora-sim" min="0" max="23.75" step="0.25" value="21">
        <output id="hora-sim-out">21:00</output>
      </div>
    </main>
  </div>

  <div id="capa-modales"></div>
</div>

<script src="vendor/leaflet/leaflet.js?v=6"></script>
<script src="js/campus-data.js?v=6"></script>
<script src="js/efemerides.js?v=6"></script>
<script src="js/lumen-mock.js?v=6"></script>
<script src="js/isp.js?v=6"></script>
<script src="js/router.js?v=6"></script>
<script src="js/incidencias.js?v=6"></script>
<script src="js/voycontigo.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
